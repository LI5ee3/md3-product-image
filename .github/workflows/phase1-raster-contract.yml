name: Phase 1 raster contract

on:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - scripts/validate_raster.py
      - scripts/test_raster_contract.py
      - scripts/test_workflow.py
      - .github/workflows/phase1-raster-contract.yml
  workflow_dispatch:

jobs:
  validate-raster-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile raster validator
        run: python -m py_compile scripts/validate_raster.py scripts/test_raster_contract.py

      - name: Run raster contract self-check
        run: python scripts/test_raster_contract.py

      - name: Run existing deterministic workflow baseline
        run: python scripts/test_workflow.py
