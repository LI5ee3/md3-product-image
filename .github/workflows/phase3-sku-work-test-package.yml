name: Phase 3 SKU Work test package

on:
  workflow_dispatch:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - docs/phase-3/WORK_TEST_SKILL_SKU.md
      - agents/openai.yaml
      - assets/Roboto-Bold.ttf
      - references/image-gen-prompt.txt
      - references/replace-variant-block.md
      - scripts/artifact_flow.py
      - scripts/common.py
      - scripts/compose_image.py
      - scripts/compose_scene.py
      - scripts/extract_palette.py
      - scripts/measure_text.py
      - scripts/scene_prompt.py
      - .github/workflows/phase3-sku-work-test-package.yml

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Gate B2 SKU test package
        run: |
          set -euo pipefail
          mkdir -p package/agents package/assets package/references package/scripts
          cp docs/phase-3/WORK_TEST_SKILL_SKU.md package/SKILL.md
          cp agents/openai.yaml package/agents/
          cp assets/Roboto-Bold.ttf package/assets/
          cp references/image-gen-prompt.txt package/references/
          cp references/replace-variant-block.md package/references/
          cp scripts/artifact_flow.py package/scripts/
          cp scripts/common.py package/scripts/
          cp scripts/compose_image.py package/scripts/
          cp scripts/compose_scene.py package/scripts/
          cp scripts/extract_palette.py package/scripts/
          cp scripts/measure_text.py package/scripts/
          cp scripts/scene_prompt.py package/scripts/
          (cd package && zip -r ../md3-product-image-phase3-palette-sku.zip .)
          unzip -l md3-product-image-phase3-palette-sku.zip

      - name: Upload Gate B2 Skill ZIP
        uses: actions/upload-artifact@v4
        with:
          name: md3-product-image-phase3-palette-sku
          path: md3-product-image-phase3-palette-sku.zip
          if-no-files-found: error
          retention-days: 30
