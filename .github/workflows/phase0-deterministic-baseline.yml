name: Phase 0 deterministic baseline

on:
  push:
    branches:
      - images-2.5-roadmap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run existing deterministic workflow self-check
        run: python scripts/test_workflow.py
