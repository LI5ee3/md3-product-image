name: Phase 3 palette extraction

on:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - 'scripts/extract_palette.py'
      - 'scripts/test_extract_palette.py'
      - '.github/workflows/phase3-palette-extraction.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile palette scripts
        run: python -m py_compile scripts/extract_palette.py scripts/test_extract_palette.py

      - name: Run deterministic palette self-check
        run: python scripts/test_extract_palette.py

      - name: Run existing deterministic workflow baseline
        run: python scripts/test_workflow.py
