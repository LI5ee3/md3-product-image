name: Phase 0 materialize visual fixtures

on:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - .github/workflows/phase0-generate-fixtures.yml
      - scripts/generate_phase0_fixtures.py

permissions:
  contents: write

jobs:
  generate-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: images-2.5-roadmap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate deterministic fixtures
        run: |
          rm -rf docs/phase-0/fixtures
          python scripts/generate_phase0_fixtures.py --output-dir docs/phase-0/fixtures

      - name: Verify fixture count and manifest
        run: |
          test -f docs/phase-0/fixtures/manifest.json
          test "$(find docs/phase-0/fixtures -maxdepth 1 -name '*.png' | wc -l)" -eq 8
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('docs/phase-0/fixtures/manifest.json').read_text())
          assert len(manifest['fixtures']) == 7
          assert len({item['id'] for item in manifest['fixtures']}) == 7
          print('Phase 0 fixture manifest verified')
          PY

      - name: Commit generated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase-0/fixtures
          if git diff --cached --quiet; then
            echo "Fixtures already match generator output"
            exit 0
          fi
          git commit -m "testdata: materialize Phase 0 visual fixtures"
          git push origin HEAD:images-2.5-roadmap
