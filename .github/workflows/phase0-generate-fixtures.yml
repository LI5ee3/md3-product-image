name: Phase 0 materialize visual fixtures

on:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - .github/workflows/phase0-generate-fixtures.yml
      - scripts/generate_phase0_fixtures.py

permissions:
  contents: write

jobs:
  generate-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: images-2.5-roadmap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate deterministic fixtures
        run: |
          rm -rf docs/phase-0/fixtures
          python scripts/generate_phase0_fixtures.py --output-dir docs/phase-0/fixtures

      - name: Verify fixture count and manifest
        run: |
          test -f docs/phase-0/fixtures/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/phase-0/fixtures')
          manifest = json.loads((root / 'manifest.json').read_text())
          fixtures = manifest['fixtures']
          assert len(fixtures) == 7
          assert len({item['id'] for item in fixtures}) == 7

          expected_pngs = 1
          for item in fixtures:
              if 'master_product' in item and 'sku_product' in item:
                  expected_pngs += 2
              elif 'product' in item:
                  expected_pngs += 1
              else:
                  raise AssertionError(f"Fixture {item['id']} has no product files")

          actual_pngs = len(list(root.glob('*.png')))
          assert actual_pngs == expected_pngs, (actual_pngs, expected_pngs)
          print(f'Phase 0 fixture manifest verified: {actual_pngs} PNG files')
          PY

      - name: Commit generated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase-0/fixtures
          if git diff --cached --quiet; then
            echo "Fixtures already match generator output"
            exit 0
          fi
          git commit -m "testdata: materialize Phase 0 visual fixtures"
          git push origin HEAD:images-2.5-roadmap
