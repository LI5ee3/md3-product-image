name: Phase 2 structured prompt

on:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - references/image-gen-prompt.txt
      - references/image-gen-prompt-v2-baseline.txt
      - scripts/test_prompt_structure.py
      - scripts/test_workflow.py
      - .github/workflows/phase2-structured-prompt.yml
  workflow_dispatch:

jobs:
  validate-structured-prompt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run structured prompt self-check
        run: python scripts/test_prompt_structure.py

      - name: Run deterministic workflow baseline
        run: python scripts/test_workflow.py
