name: One-time prompt markdown migration

on:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - .github/workflows/migrate-prompt-md.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert active prompt to Markdown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          src = Path('references/image-gen-prompt.txt')
          dst = Path('references/image-gen-prompt.md')
          if not src.is_file():
              raise SystemExit(f'missing source prompt: {src}')
          if dst.exists():
              raise SystemExit(f'refuse overwrite: {dst}')

          headings = [
              'DELIVERABLE',
              'REFERENCE ROLES',
              'VISUAL SYSTEM',
              'PALETTE',
              'COMPOSITION',
              'LIGHTING',
              'EXCLUSIONS',
              'OUTPUT CONTRACT',
          ]
          lines = src.read_text(encoding='utf-8').splitlines()
          for heading in headings:
              if lines.count(heading) != 1:
                  raise SystemExit(f'prompt heading mismatch: {heading}: {lines.count(heading)}')
          converted = [f'## {line}' if line in headings else line for line in lines]
          dst.write_text('\n'.join(converted).rstrip() + '\n', encoding='utf-8')
          src.unlink()

          replace_exact(
              'scripts/scene_prompt.py',
              'IMAGE_PROMPT_REFERENCE = SKILL_DIR / "references" / "image-gen-prompt.txt"',
              'IMAGE_PROMPT_REFERENCE = SKILL_DIR / "references" / "image-gen-prompt.md"',
          )
          replace_exact(
              'scripts/scene_prompt.py',
              "f\"run-{run['run_id'].rsplit('-', 1)[-1]}-attempt-{attempt}.txt\"",
              "f\"run-{run['run_id'].rsplit('-', 1)[-1]}-attempt-{attempt}.md\"",
          )

          replace_exact(
              'scripts/test_prompt_structure.py',
              'ACTIVE = ROOT / "references" / "image-gen-prompt.txt"',
              'ACTIVE = ROOT / "references" / "image-gen-prompt.md"',
          )
          replace_exact(
              'scripts/test_prompt_structure.py',
              '        assert lines.count(heading) == 1, heading\n        positions.append(lines.index(heading))',
              '        markdown_heading = f"## {heading}"\n        assert lines.count(markdown_heading) == 1, heading\n        positions.append(lines.index(markdown_heading))',
          )

          replace_exact(
              'SKILL.md',
              '`scene-prompt-*.txt`',
              '`scene-prompt-*.md`',
          )
          replace_exact(
              'SKILL.md',
              '`references/image-gen-prompt.txt`',
              '`references/image-gen-prompt.md`',
              expected=2,
          )
          PY

      - name: Verify prompt path migration
        shell: bash
        run: |
          set -euo pipefail
          test -f references/image-gen-prompt.md
          test ! -e references/image-gen-prompt.txt
          grep -q '^## DELIVERABLE$' references/image-gen-prompt.md
          grep -q '^## OUTPUT CONTRACT$' references/image-gen-prompt.md
          if grep -RInE 'image-gen-prompt\.txt|scene-prompt-.*\.txt' \
            SKILL.md README.md scripts .github/workflows/regression.yml docs/ROADMAP.md; then
            echo 'Active .txt prompt reference remains' >&2
            exit 1
          fi

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile production and test scripts
        run: |
          python -m py_compile \
            scripts/common.py \
            scripts/measure_text.py \
            scripts/scene_prompt.py \
            scripts/compose_scene.py \
            scripts/compose_image.py \
            scripts/artifact_flow.py \
            scripts/validate_raster.py \
            scripts/extract_palette.py \
            scripts/palette_cache.py \
            scripts/test_workflow.py \
            scripts/test_raster_contract.py \
            scripts/test_raster_integration.py \
            scripts/test_prompt_structure.py \
            scripts/test_extract_palette.py \
            scripts/test_palette_cache.py \
            scripts/test_runtime_reference_contract.py

      - name: Run consolidated regression suite
        run: |
          set -euo pipefail
          python scripts/test_workflow.py
          python scripts/test_raster_contract.py
          python scripts/test_raster_integration.py
          python scripts/test_prompt_structure.py
          python scripts/test_extract_palette.py
          python scripts/test_palette_cache.py
          python scripts/test_runtime_reference_contract.py

      - name: Verify generated prompt record suffix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'attempt-{attempt}.md' scripts/scene_prompt.py

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A references/image-gen-prompt.txt references/image-gen-prompt.md \
            SKILL.md scripts/scene_prompt.py scripts/test_prompt_structure.py
          git status --short
          git commit -m 'refactor: store production prompts as Markdown'
          git push
