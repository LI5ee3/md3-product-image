name: One-time Rubik roadmap cleanup

on:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - .github/workflows/migrate-rubik-roadmap.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary branch and workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin __noop >/dev/null 2>&1; then
            git push origin --delete __noop
          fi
          git rm .github/workflows/migrate-rubik-roadmap.yml
          git commit -m 'chore: remove temporary Rubik migration workflow'
          git push
