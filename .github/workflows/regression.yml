name: Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - images-2.5-roadmap
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'scripts/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'scripts/**'
      - '.github/workflows/regression.yml'

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile production and test scripts
        run: |
          python -m py_compile \
            scripts/common.py \
            scripts/measure_text.py \
            scripts/scene_prompt.py \
            scripts/compose_scene.py \
            scripts/compose_image.py \
            scripts/artifact_flow.py \
            scripts/validate_raster.py \
            scripts/extract_palette.py \
            scripts/palette_cache.py \
            scripts/test_workflow.py \
            scripts/test_raster_contract.py \
            scripts/test_raster_integration.py \
            scripts/test_prompt_structure.py \
            scripts/test_extract_palette.py \
            scripts/test_palette_cache.py \
            scripts/test_runtime_reference_contract.py

      - name: Original workflow regression
        run: python scripts/test_workflow.py

      - name: Raster contract regression
        run: python scripts/test_raster_contract.py

      - name: Raster production integration regression
        run: python scripts/test_raster_integration.py

      - name: Structured prompt regression
        run: python scripts/test_prompt_structure.py

      - name: Palette extraction regression
        run: python scripts/test_extract_palette.py

      - name: Palette cache regression
        run: python scripts/test_palette_cache.py

      - name: Work runtime reference contract regression
        run: python scripts/test_runtime_reference_contract.py
