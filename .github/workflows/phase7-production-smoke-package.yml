name: Phase 7 production smoke package

on:
  workflow_dispatch:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - 'SKILL.md'
      - 'agents/openai.yaml'
      - 'assets/Roboto-Bold.ttf'
      - 'references/image-gen-prompt.txt'
      - 'references/image-gen-prompt-v2-baseline.txt'
      - 'references/replace-variant-block.md'
      - 'scripts/common.py'
      - 'scripts/measure_text.py'
      - 'scripts/scene_prompt.py'
      - 'scripts/compose_scene.py'
      - 'scripts/compose_image.py'
      - 'scripts/artifact_flow.py'
      - 'scripts/validate_raster.py'
      - 'scripts/extract_palette.py'
      - 'scripts/palette_cache.py'
      - '.github/workflows/phase7-production-smoke-package.yml'

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile production scripts
        run: |
          python -m py_compile \
            scripts/common.py \
            scripts/measure_text.py \
            scripts/scene_prompt.py \
            scripts/compose_scene.py \
            scripts/compose_image.py \
            scripts/artifact_flow.py \
            scripts/validate_raster.py \
            scripts/extract_palette.py \
            scripts/palette_cache.py

      - name: Run consolidated regression subset
        run: |
          python scripts/test_workflow.py
          python scripts/test_raster_contract.py
          python scripts/test_raster_integration.py
          python scripts/test_prompt_structure.py
          python scripts/test_extract_palette.py
          python scripts/test_palette_cache.py
          python scripts/test_runtime_reference_contract.py

      - name: Build production-candidate Skill ZIP
        run: |
          set -euo pipefail
          mkdir -p package/agents package/assets package/references package/scripts
          cp SKILL.md package/
          cp agents/openai.yaml package/agents/
          cp assets/Roboto-Bold.ttf package/assets/
          cp references/image-gen-prompt.txt package/references/
          cp references/image-gen-prompt-v2-baseline.txt package/references/
          cp references/replace-variant-block.md package/references/
          cp scripts/common.py package/scripts/
          cp scripts/measure_text.py package/scripts/
          cp scripts/scene_prompt.py package/scripts/
          cp scripts/compose_scene.py package/scripts/
          cp scripts/compose_image.py package/scripts/
          cp scripts/artifact_flow.py package/scripts/
          cp scripts/validate_raster.py package/scripts/
          cp scripts/extract_palette.py package/scripts/
          cp scripts/palette_cache.py package/scripts/
          (cd package && zip -r ../md3-product-image-phase7-production-smoke.zip .)
          unzip -l md3-product-image-phase7-production-smoke.zip

      - name: Upload production-candidate Skill ZIP
        uses: actions/upload-artifact@v4
        with:
          name: md3-product-image-phase7-production-smoke
          path: md3-product-image-phase7-production-smoke.zip
          if-no-files-found: error
          retention-days: 30
