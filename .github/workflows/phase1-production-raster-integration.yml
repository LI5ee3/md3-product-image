name: Phase 1 production raster integration

on:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - 'scripts/common.py'
      - 'scripts/artifact_flow.py'
      - 'scripts/test_raster_integration.py'
      - 'scripts/test_workflow.py'
      - '.github/workflows/phase1-production-raster-integration.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile production scripts
        run: python -m py_compile scripts/common.py scripts/artifact_flow.py scripts/test_raster_integration.py

      - name: Run raster integration self-check
        run: python scripts/test_raster_integration.py

      - name: Run existing deterministic workflow baseline
        run: python scripts/test_workflow.py
