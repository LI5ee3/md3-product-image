name: Edit Release v2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/edit-release-v2.0.yml

permissions:
  contents: write

jobs:
  edit-release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Chinese release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## What's Changed

          **md3-product-image** 的首个稳定版本，版本号定为 **v2.0**，以对应本 Skill 所基于的 Images 2.0 图像生成能力。

          - 新增完整的 3:4 Google Classic MD3 电商产品图生成流程。
          - 新增基于 Images 2.0 的背景生成，并通过本地确定性流程合成产品、阴影、Logo 与文字。
          - 新增由用户控制的母版预览与显式锁定机制。
          - 新增基于已锁定母版的 SKU 变体自动顺序生成。
          - 新增母版与 SKU 重做流程，并支持持续累积附加 Prompt。
          - 新增固定产品位置、50° 二维阴影、Logo 与 Roboto Bold 排版规则，以保持输出一致性。
          - 新增按产品复用的布局、资源、背景与合成状态管理。
          - 新增确定性输出处理，在重做失败时保留已确认的现有成品。
          - 内置 Roboto Bold 字体资源，以及 Skill 所需的脚本与参考文件。
          EOF

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md
