name: Phase 6 C0 runtime control probe

on:
  workflow_dispatch:
  push:
    branches:
      - images-2.5-roadmap
    paths:
      - 'docs/phase-6/PLAN.md'
      - 'docs/phase-6/WORK_TEST_SKILL_C0.md'
      - 'docs/phase-6/openai-c0.yaml'
      - '.github/workflows/phase6-c0-runtime-controls-package.yml'

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build C0 Work test package
        run: |
          set -euo pipefail
          mkdir -p package/agents
          cp docs/phase-6/WORK_TEST_SKILL_C0.md package/SKILL.md
          cp docs/phase-6/openai-c0.yaml package/agents/openai.yaml
          (cd package && zip -r ../phase6-c0-r2-runtime-controls.zip .)
          unzip -l phase6-c0-r2-runtime-controls.zip
          unzip -p phase6-c0-r2-runtime-controls.zip SKILL.md | grep -F 'name: phase6-runtime-control-probe-r2'
          unzip -p phase6-c0-r2-runtime-controls.zip SKILL.md | grep -F 'PROBE_PACKAGE_ID: `PHASE6-C0-R2-20260910`'
          unzip -p phase6-c0-r2-runtime-controls.zip agents/openai.yaml | grep -F '$phase6-runtime-control-probe-r2'

      - name: Upload C0 Work test Skill ZIP
        uses: actions/upload-artifact@v4
        with:
          name: phase6-c0-r2-runtime-controls
          path: phase6-c0-r2-runtime-controls.zip
          if-no-files-found: error
          retention-days: 30
